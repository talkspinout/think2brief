<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#161b1d" />
    <meta name="robots" content="noindex" />
    <!--
      구조만 먼저 만들어 둔 페이지입니다. Chrome 웹스토어 심사 전이라 아직
      내비게이션에 링크하거나 sitemap.xml에 넣지 않았습니다. 실제 업데이트
      항목을 채우기 시작할 때 noindex를 제거하고 sitemap과 헤더/푸터 링크에
      추가하세요.
    -->
    <meta
      name="description"
      content="Think2Brief — Marketing의 업데이트 노트."
    />
    <link rel="canonical" href="https://talkspinout.github.io/think2brief/updates/" />
    <link rel="icon" type="image/png" href="../assets/icon128.png" />
    <link rel="stylesheet" href="../assets/styles.css" />
    <title>업데이트 노트 · Think2Brief — Marketing</title>
  </head>
  <body class="policy-body">
    <a class="skip-link" href="#updates" data-i18n="skip-link">본문으로 건너뛰기</a>

    <div id="lang-banner" class="lang-banner" hidden>
      <div class="shell lang-banner-inner">
        <p data-i18n="langBanner.text">Read this page in English?</p>
        <div class="lang-banner-actions">
          <button type="button" class="button button-light" data-lang-switch="en" data-i18n="langBanner.switch">
            View in English
          </button>
          <button type="button" class="lang-banner-dismiss" data-lang-dismiss data-i18n="langBanner.dismiss" aria-label="Dismiss">
            Dismiss
          </button>
        </div>
      </div>
    </div>

    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="../" data-i18n-attr-aria-label="nav.brandAria" aria-label="Think2Brief 홈">
          <span class="brand-mark" aria-hidden="true"><span></span></span>
          <span>Think2Brief <b>— Marketing</b></span>
        </a>
        <nav class="site-nav" data-i18n-attr-aria-label="nav.menuAria" aria-label="주요 메뉴">
          <a href="../" data-i18n="nav.product">제품 소개</a>
          <a class="nav-contact" href="mailto:think2brief@gmail.com" data-i18n="nav.contact">문의</a>
          <div class="lang-toggle" role="group" aria-label="Language">
            <button type="button" data-lang-switch="ko" aria-pressed="true">KO</button>
            <button type="button" data-lang-switch="en" aria-pressed="false">EN</button>
          </div>
        </nav>
      </div>
    </header>

    <main id="updates" class="shell updates-layout">
      <div class="updates-heading">
        <p class="eyebrow" data-i18n="updates.eyebrow">UPDATES</p>
        <h1 data-i18n="updates.title">업데이트 노트</h1>
        <p data-i18n="updates.description">
          Think2Brief에 추가되거나 바뀐 내용을 짧게 정리합니다. 커밋 로그가
          아니라 실제로 체감할 수 있는 변화 위주로 기록합니다.
        </p>
      </div>

      <ul class="updates-list" aria-live="polite">
        <li class="updates-empty" data-i18n="updates.empty">
          업데이트 노트를 준비 중입니다. 다음 업데이트부터 이곳에 기록을
          남깁니다.
        </li>
      </ul>
    </main>

    <footer class="site-footer policy-footer">
      <div class="shell footer-bottom">
        <a href="../" data-i18n="footer.backToProduct">← 제품 소개로 돌아가기</a>
        <span>© 2026 Hongseok. All rights reserved.</span>
      </div>
    </footer>

    <script src="../assets/i18n.js"></script>
    <script src="../assets/i18n-updates.js"></script>
  </body>
</html>
